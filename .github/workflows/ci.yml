name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # mediapipe's libmediapipe.so links libEGL.so.1 and libGLESv2.so.2,
      # which the runner image does not ship.
      - name: Install system libraries for mediapipe
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,perception]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest tests/ -v
