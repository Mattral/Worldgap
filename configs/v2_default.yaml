# Default config for V2 (actuation gap). Loaded via `worldgap train --config`.
#
# state_dim MUST be set explicitly for actuation (GapConfig raises otherwise,
# per spec 5.1.1). 3 matches ACTUATION_STATE_LAYOUT in
# `data/loaders/pgm_sim.py`: [pressure_mpa, force_n, length_mm], normalized.
#
# It was 2 in 0.1.0, described as [commanded_pressure, joint_angle] -- a
# placeholder from before any real actuator data existed. The real
# characterization that now ships with the package (Ogawa 2017 Fig. 4a) is a
# Length(Force) family parameterized by pressure, so all three channels are
# needed and the joint angle is not measured anywhere. Set this back to 2 only
# if you are genuinely modelling a commanded-pressure/joint-angle pair.

state_dim: 3

encoder:
  d_model: 32          # smaller than V1's -- spec 6.2, much lower input dimensionality
  n_layers: 2
  n_heads: 4
  dim_feedforward: 64
  dropout: 0.1

world_model:
  # Windows are short because each rollout is one quasi-static load sweep of
  # roughly 97 points, not a long recording.
  context_frames: 8
  predict_frames: 4
  ema_decay: 0.996
  # 8, not 32. Spec 7.3 wants n >= 5 * summary_dim, and the real side has only
  # the 7 pressure levels Ogawa et al. ever published -- about 35 windows after
  # splitting. A larger summary space cannot add information that does not
  # exist in the literature; it would only push the confidence flag down.
  summary_dim: 8
  collapse_variance_threshold: 0.0001
  collapse_patience_checks: 3

training:
  lr: 0.0003
  weight_decay: 0.01
  batch_size: 16
  max_epochs: 40
  seed: 0
