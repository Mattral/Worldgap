[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldgap"
version = "0.2.0"
description = "Reusable world-model-based domain-gap quantification for perception and actuation pipelines, before touching hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Min (Mattral)" }]
keywords = ["sim2real", "domain-gap", "world-model", "jepa", "robotics", "rehabilitation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",  # needs scipy.optimize.isotonic_regression
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "pandas>=2.1",
    "pyyaml>=6.0",
    # Needed for `worldgap analyze --output report.html` (spec 9.3) -- kept as a
    # core dep rather than an extra since the CLI's --output flag is part of
    # the MUST surface (9.2), not an opt-in feature.
    "matplotlib>=3.7",
    # torch is core, not optional -- the World Model Core (analyzer.py ->
    # models/world_model.py) is needed for BOTH modalities, not just one.
    "torch>=2.2",
]

[project.optional-dependencies]
# V1 data loading only: MediaPipe landmark extraction from video/images. The
# world model itself does NOT need this extra.
#
# The floor is 1.0, NOT 0.10, and this is a real constraint rather than
# tidiness: `mediapipe.tasks.python.vision.HolisticLandmarker` -- the entry
# point every V1 loader here is written against -- is absent from the 0.10.x
# Python wheels. `pip install "mediapipe>=0.10"` happily resolves to 0.10.32,
# where `vision` exports PoseLandmarker and HandLandmarker and no holistic
# anything, and the legacy `mp.solutions` API is gone too. Verified by
# inspecting the installed packages, not assumed. Loosen this and the first
# real V1 run fails with AttributeError on someone else's machine.
# `scripts/check_mediapipe_setup.py` checks this before a run starts.
perception = [
    "mediapipe>=1.0",
]
# V2 data loading only: MuJoCo compliant-actuator simulation. The world model
# itself does NOT need this extra.
actuation = [
    "mujoco>=3.1",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    # Used only to build tiny fixture PNGs in test_mediapipe_extract.py
    "pillow>=10.0",
]

[project.scripts]
worldgap = "worldgap.cli:main"

[project.urls]
Homepage = "https://github.com/Mattral/worldgap"
Repository = "https://github.com/Mattral/worldgap"
Issues = "https://github.com/Mattral/worldgap/issues"
Changelog = "https://github.com/Mattral/worldgap/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/worldgap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
